name: Test and deploy review

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_REVIEW_PIN_HASH: ${{ secrets.REVIEW_PIN_HASH }}
      - uses: actions/configure-pages@v5
        if: ${{ vars.ENABLE_PAGES == 'true' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ vars.ENABLE_PAGES == 'true' }}
        with:
          path: dist

  deploy:
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
